name: Job Scout Daily Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata (UTC+5:30)
  push:
    branches: ["main"]
    paths:
      - "job-search-agent/agent.py"
      - "job-search-agent/sources.json"
      - ".github/workflows/job-search-agent.yml"

permissions:
  contents: write

concurrency:
  group: job-scout-scan
  cancel-in-progress: false

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile job-search-agent/agent.py job-search-agent/apply_agent.py job-search-agent/local_app.py job-search-agent/test_apply_agent.py

      - name: Test resume match and application safety
        working-directory: job-search-agent
        run: python -m unittest test_apply_agent.py

      - name: Collect and rank official postings
        working-directory: job-search-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python agent.py

      - name: Save refreshed job feed
        run: |
          if git diff --quiet -- job-search-agent/data/jobs.json job-search-agent/data/latest.md; then
            echo "No job feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-search-agent/data/jobs.json job-search-agent/data/latest.md
          git commit -m "chore: refresh Job Scout listings"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "Rebase failed; aborting rather than overwriting repository changes."
              git rebase --abort || true
              exit 1
            fi
            if git push; then
              echo "Job feed saved successfully."
              exit 0
            fi
            echo "Remote changed during push (attempt ${attempt}/5); retrying after a short pause."
            sleep 2
          done
          echo "Could not save job feed after 5 attempts."
          exit 1
